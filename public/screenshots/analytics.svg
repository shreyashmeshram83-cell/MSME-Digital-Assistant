<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MSME Workspace AI insights</title><desc id="desc">Analytics screen with prioritized receivables, stockout prevention, and business insights.</desc>
  <rect width="1600" height="900" fill="#fff"/><rect width="248" height="900" fill="#fafafa"/><path d="M248 0v900M0 62h1600" stroke="#e5e5e5"/><rect x="18" y="12" width="35" height="36" rx="9" fill="#090909"/><text x="23" y="37" fill="#fff" font-family="Arial" font-size="14" font-weight="700">MDA</text><text x="64" y="29" font-family="Arial" font-size="14" font-weight="700" fill="#151515">MSME Workspace</text><text x="64" y="45" font-family="Arial" font-size="11" fill="#737373">Digital Assistant · Business</text><text x="18" y="92" font-family="Arial" font-size="10" letter-spacing="1" fill="#888">WORKSPACE</text>
  <g font-family="Arial" font-size="14" fill="#343434"><text x="20" y="133">▦　Overview</text><text x="20" y="175">◈　Inventory</text><text x="20" y="216">▤　Sales &amp; Invoicing</text><rect x="8" y="231" width="232" height="38" rx="8" fill="#f0f0f0"/><text x="20" y="256" font-weight="700">⌁　Analytics</text><text x="20" y="335">✧　AI Assistant</text><text x="20" y="375">⚙　Settings</text></g><text x="269" y="37" font-family="Arial" font-size="14" fill="#6b7280">Workspace　›　<tspan fill="#171717" font-weight="700">Analytics</tspan></text>
  <rect x="268" y="77" width="1300" height="795" rx="14" fill="#fff" stroke="#e2e2e2"/><rect x="292" y="98" width="40" height="40" rx="10" fill="#f0f0f0"/><text x="302" y="125" font-family="Arial" font-size="19" fill="#222">✧</text><text x="345" y="112" font-family="Arial" font-size="11" letter-spacing="2" fill="#64748b">AI INTELLIGENCE</text><text x="345" y="136" font-family="Arial" font-size="18" font-weight="700" fill="#111">AI Insights</text><rect x="1450" y="105" width="96" height="28" rx="14" fill="#fff" stroke="#e5e5e5"/><text x="1464" y="124" font-family="Arial" font-size="11" fill="#65748b">Auto-updated</text>
  <g fill="#fff" stroke="#e4e4e4"><rect x="292" y="160" width="620" height="335" rx="12"/><rect x="926" y="160" width="620" height="335" rx="12"/><rect x="292" y="510" width="620" height="335" rx="12"/><rect x="926" y="510" width="620" height="335" rx="12"/></g>
  <g font-family="Arial"><rect x="310" y="179" width="72" height="24" rx="12" fill="#fff0f2"/><text x="326" y="195" font-size="10" font-weight="700" fill="#f43f5e">URGENT</text><text x="394" y="197" font-size="15" font-weight="700" fill="#161616">Receivables Collection Priority</text><rect x="804" y="179" width="91" height="24" rx="12" fill="#fff" stroke="#ddd"/><text x="817" y="195" font-size="11" fill="#68768b">96% Confidence</text><path d="M310 216h584" stroke="#eee"/><text x="310" y="252" font-size="14" font-weight="700" fill="#151515">Receivables total ₹11,31,700, growing faster than monthly sales pace.</text><text x="310" y="286" font-size="12" fill="#54647a"><tspan font-weight="700" fill="#111">Why this matters: </tspan>Sharma Retailers and Wardha Road Developers hold over ₹1.8L in overdue balances past 30 days.</text><text x="310" y="320" font-size="12" fill="#10a477"><tspan font-weight="700">Expected benefit: </tspan>Reclaims ₹11,31,700 back into liquid bank balances within 14 days.</text><text x="310" y="354" font-size="12" fill="#f43f5e"><tspan font-weight="700">Cost if ignored: </tspan>Risk of bad debt write-offs and delayed payments to key raw material suppliers.</text><rect x="310" y="374" width="584" height="57" rx="6" fill="#fff" stroke="#ddd"/><text x="323" y="399" font-size="12" fill="#151515"><tspan font-weight="700">Recommended action: </tspan>Freeze further credit extensions for high-risk accounts and send</text><text x="323" y="418" font-size="12" fill="#151515">automated WhatsApp payment reminders today.</text><text x="310" y="470" font-size="10" fill="#6f7e92">Sources: Order Payment Ledger · Accounts Receivable Aging Matrix</text><text x="739" y="470" font-size="10" fill="#6f7e92">Window: Last 90 Days</text>
  <rect x="944" y="179" width="72" height="24" rx="12" fill="#fff0f2"/><text x="960" y="195" font-size="10" font-weight="700" fill="#f43f5e">URGENT</text><text x="1028" y="197" font-size="15" font-weight="700" fill="#161616">Inventory Stockout Prevention</text><rect x="1438" y="179" width="91" height="24" rx="12" fill="#fff" stroke="#ddd"/><text x="1451" y="195" font-size="11" fill="#68768b">94% Confidence</text><path d="M944 216h584" stroke="#eee"/><text x="944" y="252" font-size="14" font-weight="700" fill="#151515">0 fast-moving items are below safety stock thresholds during peak season.</text><text x="944" y="286" font-size="12" fill="#54647a"><tspan font-weight="700" fill="#111">Why this matters: </tspan>Demand is accelerating while supplier lead times require 4–5 days.</text><text x="944" y="320" font-size="12" fill="#10a477"><tspan font-weight="700">Expected benefit: </tspan>Protects ₹3,95,000 in projected sales turnover across the next cycle.</text><text x="944" y="354" font-size="12" fill="#f43f5e"><tspan font-weight="700">Cost if ignored: </tspan>Immediate revenue loss and buyer redirection to local competitors.</text><rect x="944" y="374" width="584" height="57" rx="6" fill="#fff" stroke="#ddd"/><text x="957" y="406" font-size="12" fill="#151515"><tspan font-weight="700">Recommended action: </tspan>Place immediate reorder of 100 bags UltraTech Cement.</text><text x="944" y="470" font-size="10" fill="#6f7e92">Sources: Live Stock Ledger · Supplier Lead Time Registry</text><text x="1372" y="470" font-size="10" fill="#6f7e92">Window: 30 Days</text>
  <text x="310" y="551" font-size="10" fill="#f97316">HIGH IMPACT</text><text x="397" y="553" font-size="15" font-weight="700" fill="#111">Revenue Expansion Momentum</text><path d="M310 570h584" stroke="#eee"/><text x="310" y="606" font-size="14" font-weight="700" fill="#151515">Monthly revenue expanded over the previous billing cycle.</text><text x="310" y="640" font-size="12" fill="#54647a">Why this matters: High customer order fulfillment and strong sales velocity.</text><text x="310" y="674" font-size="12" fill="#10a477">Expected benefit: Sustains gross profit margin into the upcoming quarter.</text><text x="310" y="708" font-size="12" fill="#f43f5e">Cost if ignored: Missed upselling opportunities on high-margin categories.</text><rect x="310" y="730" width="584" height="55" rx="6" fill="#fff" stroke="#ddd"/><text x="323" y="762" font-size="12" fill="#151515"><tspan font-weight="700">Recommended action: </tspan>Cross-sell to active commercial accounts.</text><text x="310" y="819" font-size="10" fill="#6f7e92">Sources: Monthly Revenue Ledger · Sales Series Analytics</text>
  <text x="944" y="553" font-size="10" fill="#10a477">LOW RISK</text><text x="1012" y="553" font-size="15" font-weight="700" fill="#111">Operating Expense Optimization</text><path d="M944 570h584" stroke="#eee"/><text x="944" y="606" font-size="14" font-weight="700" fill="#151515">Operating expense run-rate is being monitored against revenue.</text><text x="944" y="640" font-size="12" fill="#54647a">Why this matters: Small-lot deliveries can increase freight overhead.</text><text x="944" y="674" font-size="12" fill="#10a477">Expected benefit: Savings by consolidating delivery runs.</text><text x="944" y="708" font-size="12" fill="#f43f5e">Cost if ignored: Erosion of gross margin over the next quarter.</text><rect x="944" y="730" width="584" height="55" rx="6" fill="#fff" stroke="#ddd"/><text x="957" y="762" font-size="12" fill="#151515"><tspan font-weight="700">Recommended action: </tspan>Consolidate delivery runs and optimize logistics spend.</text><text x="944" y="819" font-size="10" fill="#6f7e92">Sources: Expense Run-rate Ledger · P&amp;L Breakdown</text></g>
</svg>
