<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">MSME Digital Assistant</title><desc id="desc">On-device assistant with prompt suggestions, model selection, and message composer.</desc>
  <rect width="1600" height="900" fill="#fafafa"/><rect width="1600" height="65" fill="#fff"/><path d="M0 65h1600M0 665h1600M0 726h1600M0 878h1600" stroke="#dedede"/><rect x="17" y="12" width="45" height="44" rx="10" fill="#111"/><text x="24" y="41" font-family="Arial" font-size="17" fill="#fff">✧</text><text x="80" y="30" font-family="Arial" font-weight="700" font-size="16" fill="#161616">Digital Assistant</text><circle cx="87" cy="47" r="4" fill="#41c59d"/><text x="98" y="51" font-family="Arial" font-size="12" fill="#737373">Live ERP Intelligence · Ready</text><g fill="#555" font-family="Arial" font-size="18"><text x="1397" y="38">⤢</text><text x="1448" y="38">↗</text><text x="1493" y="38">◷</text><text x="1536" y="38">＋</text><text x="1575" y="38">×</text></g>
  <rect x="17" y="99" width="1350" height="73" rx="14" fill="#fff" stroke="#dedede"/><text x="42" y="142" font-family="Arial" font-size="15" fill="#242424">Namaste 👋 I&apos;m your local operations assistant running on-device. Ask me about stock, GST, invoices or demand — pick a prompt below to start.</text>
  <rect x="0" y="665" width="1600" height="61" fill="#fff"/><text x="17" y="702" font-family="Arial" font-size="13" fill="#78808c">AI Provider Mode</text><rect x="1245" y="678" width="335" height="37" rx="7" fill="#fff" stroke="#ddd"/><text x="1261" y="701" font-family="Arial" font-size="13" fill="#1c2430">Auto (OpenRouter + Local Heuristics)　⌄</text>
  <text x="17" y="756" font-family="Arial" font-weight="700" font-size="12" fill="#888">QUICK PROMPTS</text>
  <g font-family="Arial" font-size="12" fill="#747474"><rect x="17" y="773" width="518" height="38" rx="20" fill="#fff" stroke="#ddd"/><text x="34" y="797">My cement stock is running low and customer payments are late</text><rect x="545" y="773" width="367" height="38" rx="20" fill="#fff" stroke="#ddd"/><text x="561" y="797">Which accounts need attention this week?</text><rect x="920" y="773" width="472" height="38" rx="20" fill="#fff" stroke="#ddd"/><text x="938" y="797">What should I restock first and which supplier to contact?</text>
  <rect x="17" y="820" width="564" height="38" rx="20" fill="#fff" stroke="#ddd"/><text x="34" y="844">Draft an invoice of ₹50,000 for Wardha Road Developers with 18% GST</text><rect x="591" y="820" width="510" height="38" rx="20" fill="#fff" stroke="#ddd"/><text x="609" y="844">Send payment reminder on WhatsApp for overdue bill</text><rect x="17" y="867" width="380" height="25" rx="13" fill="#fff" stroke="#ddd"/><text x="34" y="884">Generate GST sales summary &amp; 30-day forecast</text><rect x="407" y="867" width="393" height="25" rx="13" fill="#fff" stroke="#ddd"/><text x="424" y="884">Which 3 items have the highest stock turnover?</text></g>
  <rect x="17" y="890" width="1450" height="46" rx="11" fill="#fff" stroke="#ddd"/><text x="35" y="918" font-family="Arial" font-size="14" fill="#9aa0a8">Ask about stock, GST, invoices, collections...</text><rect x="1480" y="890" width="55" height="46" rx="10" fill="#888"/><text x="1498" y="919" font-family="Arial" font-size="17" fill="#fff">➤</text>
</svg>
